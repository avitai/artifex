name: Documentation

# Read the Docs builds and hosts the documentation (.readthedocs.yaml). This workflow only checks
# that the documentation validates and the site builds strictly, so a change that breaks either
# fails before it reaches Read the Docs.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'src/artifex/**'
      - 'scripts/validate_docs.py'
      - '.github/actions/setup-artifex/action.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'src/artifex/**'
      - 'scripts/validate_docs.py'
      - '.github/actions/setup-artifex/action.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request cancels its superseded run; a push to main always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Artifex docs environment
        uses: ./.github/actions/setup-artifex
        with:
          python-version: '3.12'
          cache-suffix: docs-py311
          linux-editable-target: ".[docs]"

      - name: Validate documentation contract
        run: uv run python scripts/validate_docs.py --config-path mkdocs.yml --docs-path docs --src-path src

      - name: Build documentation
        run: uv run mkdocs build --clean --strict
