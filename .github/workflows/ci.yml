name: Artifex CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      - name: Compare this tree with the pull request that produced it
        id: compare
        # Only a merge repeats work. A manual run is asked for because someone wants the run.
        # When this step does not run the output is empty, which every consumer reads as
        # "test it".
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          pull_request=$(git log -1 --pretty=%s | sed -n 's/.*(#\([0-9]\+\))$/\1/p')
          if [ -n "$pull_request" ]; then
            # Every lookup below answers "unknown" rather than failing: a subject that ends in
            # a number naming no pull request must leave the run green and running, not red.
            # The pull ref outlives the branch, so this still resolves after a merge deleted it.
            git fetch --no-tags --depth=1 origin "refs/pull/$pull_request/head" || true
            tree=$(git rev-parse "HEAD^{tree}")
            tested=$(git rev-parse "FETCH_HEAD^{tree}" 2>/dev/null || echo unknown)
            failed=$(gh pr view "$pull_request" --json statusCheckRollup --jq \
              '[.statusCheckRollup[] | (.conclusion // .state)
                | select(. == "FAILURE" or . == "TIMED_OUT" or . == "ERROR")] | length' \
              2>/dev/null || echo unknown)
            if [ "$tree" = "$tested" ] && [ "$failed" = "0" ]; then
              skip=true
            fi
            echo "pull request #$pull_request: tree $tested, failed checks $failed"
          fi
          echo "this tree $(git rev-parse 'HEAD^{tree}') already tested: $skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # Not gated on already_tested: every job waits on it, including the main-only
  # performance job, and a skipped dependency would take that job down with it.
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Artifex
        uses: ./.github/actions/setup-artifex
        with:
          python-version: "3.12"
          cache-suffix: quality
          linux-editable-target: ".[dev]"

      - name: Lock file is current
        run: uv lock --check

      - name: Run Ruff
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run pre-commit hooks
        env:
          PRE_COMMIT_HOME: /tmp/pre-commit-cache
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Documented model surface matches the tree
        run: uv run python scripts/derive_status.py --check

  unit_tests:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [quality, already_tested]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The macOS-14 runners queue for hours and run the same steps; they run on
        # pushes to main only, so a branch or pull request is gated by the ubuntu
        # jobs alone and the merge to main measures both platforms. A merge of a tree
        # its pull request already tested runs only macOS, which no pull request ran.
        os: ${{ fromJSON(needs.already_tested.outputs.skip == 'true' && '["macos-14"]' || (github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]')) }}
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Artifex
        uses: ./.github/actions/setup-artifex
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: unit-${{ matrix.python-version }}-${{ matrix.os }}
          linux-editable-target: ".[dev,test]"
          macos-editable-target: ".[all-cpu]"

      - name: Run unit tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/ -v -m "not slow and not blackjax" \
            --cov=src/artifex --cov-report=xml --cov-report=term-missing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            .coverage
            coverage.xml
            test-results/
          include-hidden-files: true
        if: always()

  integration_tests:
    name: Integration Tests
    needs: [unit_tests, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Artifex
        uses: ./.github/actions/setup-artifex
        with:
          python-version: "3.12"
          cache-suffix: integration
          linux-editable-target: ".[dev,test]"

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/artifex/generative_models/integration/ -v \
            --cov=src/artifex --cov-report=xml --cov-report=term-missing --cov-fail-under=0

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            .coverage
            coverage.xml
            test-results/
          include-hidden-files: true
        if: always()

  e2e_tests:
    name: End-to-End Tests
    needs: [integration_tests, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Artifex
        uses: ./.github/actions/setup-artifex
        with:
          python-version: "3.12"
          cache-suffix: e2e
          linux-editable-target: ".[dev,test]"

      - name: Run end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/ -v -m e2e \
            --cov=src/artifex --cov-report=xml --cov-report=term-missing --cov-fail-under=0

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            .coverage
            coverage.xml
            test-results/
          include-hidden-files: true
        if: always()

  performance_tests:
    name: Performance Tests
    needs: unit_tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Artifex
        uses: ./.github/actions/setup-artifex
        with:
          python-version: "3.12"
          cache-suffix: perf
          linux-editable-target: ".[dev,test]"

      - name: Run performance tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/ -v -m "benchmark or performance" --benchmark-autosave --benchmark-columns=mean,stddev,min,max --no-cov

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            benchmark.json
            histogram.svg
        if: always()

  coverage:
    name: Test Coverage
    needs: [unit_tests, integration_tests, e2e_tests, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Artifex
        uses: ./.github/actions/setup-artifex
        with:
          python-version: "3.12"
          cache-suffix: coverage
          linux-editable-target: ".[dev,test]"

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifact contents
        run: |
          echo "Listing artifact directory structure:"
          find artifacts -type f | sort
          echo "Checking for .coverage files:"
          find artifacts -name ".coverage" | sort

      - name: Combine coverage reports
        shell: bash
        run: |
          set -euo pipefail
          if ls artifacts/*/.coverage 1> /dev/null 2>&1; then
            uv run coverage combine artifacts/*/.coverage
          else
            echo "ERROR: No .coverage files found to combine"
            exit 1
          fi
          uv run coverage report
          uv run coverage xml

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: coverage.xml
        if: always()
