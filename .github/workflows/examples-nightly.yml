name: Examples (nightly)

# The shared example guide runs every example on a schedule, so a change outside artifex that
# breaks one (a dataset, a runner image) is found without a change here. The same workflow runs
# on pull requests and pushes from ci.yml.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  examples:
    # Pinned by commit (substrax v0.1.38).
    uses: avitai/substrax/.github/workflows/examples.yml@d0c7a483f082e9e1b23bba1e245747bf5a463177
